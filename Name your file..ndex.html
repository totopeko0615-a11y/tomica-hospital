<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>トミカ医科大学病院 | 公式サイト</title>
  <meta name="description" content="外来予約・診療科・医師紹介。周央サンゴによる改革と実績を発信します。">
  <style>
    :root{--brand:#0f3a64;--ink:#1f2937;--muted:#6b7280;--line:#e5e7eb;--accent:#2b6cb0}
    *{box-sizing:border-box}
    body{font-family:system-ui,"Hiragino Sans","Noto Sans JP",sans-serif;line-height:1.6;margin:0;color:var(--ink)}
    a{color:var(--accent);text-decoration:none}
    header,main,footer{padding:0 16px}
    .top{background:var(--brand);color:#fff}
    .bar{display:flex;gap:12px;align-items:center;justify-content:space-between;padding:10px 0}
    .brand{display:flex;gap:10px;align-items:center}
    .brand img{width:28px;height:28px;border-radius:4px;background:#fff;object-fit:cover}
    .brand .ttl{line-height:1}
    .brand b{font-size:1.05rem;letter-spacing:.05em}
    .sub{font-size:.72rem;opacity:.9;letter-spacing:.08em}
    nav ul{list-style:none;display:flex;gap:10px;margin:0;padding:0;flex-wrap:wrap}
    nav a{display:inline-block;padding:6px 10px;border-radius:8px;border:1px solid transparent;color:#cfe3fb}
    nav a:hover{background:rgba(255,255,255,.1)}
    .hero{padding:28px 0;background:#0f3a64;color:#fff}
    h1{font-size:1.6rem;margin:0 0 8px}
    .btn{display:inline-block;padding:10px 14px;border-radius:10px;border:1px solid #e5efff;background:#2b6cb0;color:#fff}
    .btn.ghost{background:transparent;border-color:#93c5fd;color:#e0f2fe}
    .btns{display:flex;gap:10px;flex-wrap:wrap;margin:14px 0}
    section{padding:18px 0}
    h2{font-size:1.15rem;margin:0 0 10px}
    .card{border:1px solid var(--line);border-radius:12px;padding:12px;background:#fff}
    .muted{color:var(--muted)}
    .mini{font-size:.92rem}
    footer small{color:var(--muted)}
  </style>
</head>
<body>
  <div class="top">
    <header class="bar">
      <div class="brand">
        <img src="./assets/img/logo.png" alt="トミカ医科大学病院のロゴ">
        <div class="ttl">
          <b>トミカ医科大学病院</b><br>
          <span class="sub">TOMICA UNIVERSITY HOSPITAL</span>
        </div>
      </div>
      <nav aria-label="グローバルナビ">
        <ul>
          <li><a href="./reservation.html">外来予約</a></li>
          <li><a href="#" onclick="alert('準備中です');return false;">診療科一覧</a></li>
          <li><a href="#" onclick="alert('準備中です');return false;">医師紹介</a></li>
          <li><a href="#" onclick="alert('準備中です');return false;">改革特設</a></li>
        </ul>
      </nav>
    </header>
    <div class="hero">
      <h1>安全・安心の医療を、改革の力で前へ。</h1>
      <p class="mini" style="opacity:.95">周央サンゴの三本柱（院内改革・人事改革・院外改革）を着実に実行。患者さんに分かりやすい情報発信を続けます。</p>
      <div class="btns">
        <a class="btn" href="./reservation.html">外来予約へ</a>
        <a class="btn ghost" href="#" onclick="alert('準備中です');return false;">診療科を探す</a>
      </div>
    </div>
  </div>
  <main>
    <section id="news">
      <h2>お知らせ</h2>
      <div class="card">
        <p class="muted mini">現在、お知らせはありません。</p>
      </div>
    </section>
    <section id="access">
      <h2>アクセス・連絡先</h2>
      <div class="card">
        <p class="mini">
          住所：トミカ市 未来町1-5<br>
          電話：<a href="tel:022-110-446">022-110-446</a><br>
          アクセス：JRトミカ駅から徒歩30分／富良野バスターミナルから「トミカ医科大学病院線」で約30分
        </p>
      </div>
    </section>
  </main>
  <footer>
    <small>© 2026 トミカ医科大学病院</small>
  </footer>
</body>
</html>
